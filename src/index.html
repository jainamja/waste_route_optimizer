<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver Navigation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2F5FFF;
            --primary-hover: #1e40af;
            --amber: #FFA93E;
            --green: #10b981;
            --red: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-soft: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
            --rad: 24px;
        }

        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 16px;
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        h1, h2, h3, h4 { font-family: 'Manrope', sans-serif; margin: 0; }

        .container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            box-shadow: var(--shadow-soft);
        }

        .header h1 { font-size: 18px; color: var(--primary); display: flex; align-items: center; gap: 8px;}

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--rad);
            box-shadow: var(--shadow-soft);
        }

        .progress-text {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stop-name {
            font-size: 28px;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .stop-address {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 24px;
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            margin-bottom: 12px;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }

        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(47, 95, 255, 0.3); }
        .btn-success { background: var(--green); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-outline { background: white; border: 2px solid var(--border); color: var(--text-main); }
        .btn-danger { background: #fee2e2; color: var(--red); border: 2px solid #fecaca; }

        /* Overview List */
        .overview-title {
            font-size: 16px;
            margin: 24px 0 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stop-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stop-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg);
            border-radius: 12px;
            font-size: 14px;
        }
        .stop-item.active {
            background: white;
            border: 2px solid var(--primary);
            box-shadow: 0 2px 8px rgba(47, 95, 255, 0.1);
        }
        .stop-item.completed { opacity: 0.6; }
        
        .status-icon { font-size: 18px; width: 24px; text-align: center; }
        .status-icon.completed { color: var(--green); }
        .status-icon.skipped { color: var(--red); }
        .status-icon.pending { color: var(--text-muted); }

        .empty-state { text-align: center; padding: 40px 20px; }
        .empty-state i { font-size: 48px; color: var(--text-muted); margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Rendered by JS -->
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAhLnjh0gRa2pf29G90zr-6AMcjLjbQpPg",
            authDomain: "wasteroutelive.firebaseapp.com",
            databaseURL: "https://wasteroutelive-default-rtdb.firebaseio.com",
            projectId: "wasteroutelive",
            storageBucket: "wasteroutelive.firebasestorage.app",
            messagingSenderId: "141692937729",
            appId: "1:141692937729:web:66398f74c16562c5d58200"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        // Capacitor Native App Link Interceptor (for initial load)
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
            window.Capacitor.Plugins.App.addListener('appUrlOpen', data => {
                try {
                    let urlStr = data.url;
                    if (urlStr.includes('?')) {
                        let query = urlStr.substring(urlStr.indexOf('?'));
                        window.location.search = query;
                    }
                } catch(e) { console.error(e); }
            });
        }

        const app = document.getElementById('app');
        const urlParams = new URLSearchParams(window.location.search);
        let truckId = urlParams.get('t');
        
        let stops = [];
        let currentIndex = 0;
        let gpsInterval = null;

        function init() {
            if (!truckId) truckId = "1"; // Fallback for testing
            
            // Start GPS Polling
            startGpsPolling();

            // Listen to Firebase for this truck's route
            const routeRef = db.ref(`routes/route_${truckId}/stops`);
            routeRef.on('value', snapshot => {
                const data = snapshot.val();
                if (data) {
                    stops = [];
                    for (let key in data) {
                        stops.push({ id: key, ...data[key] });
                    }
                    stops.sort((a, b) => a.sequence - b.sequence);
                    
                    currentIndex = 0;
                    for (let i = 0; i < stops.length; i++) {
                        if (stops[i].status === 'PENDING') {
                            currentIndex = i;
                            break;
                        }
                        if (i === stops.length - 1 && stops[i].status !== 'PENDING') {
                            currentIndex = stops.length;
                        }
                    }
                    render();
                } else {
                    // Automatically create empty route if not found (for easy testing without backend)
                    stops = [];
                    renderError("Waiting for Dispatcher to assign route to Truck " + truckId + "...");
                }
            });
        }

        function startGpsPolling() {
            if (!navigator.geolocation) return;
            
            updateGps();
            gpsInterval = setInterval(updateGps, 15000); // 15 seconds
            
            const truckRef = db.ref(`trucks/${truckId}`);
            truckRef.child('status').onDisconnect().set('offline');
            truckRef.child('status').set('online');
            truckRef.child('name').set('Truck ' + truckId);
        }

        function updateGps() {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    db.ref(`trucks/${truckId}`).update({
                        currentLat: pos.coords.latitude,
                        currentLng: pos.coords.longitude,
                        lastUpdated: firebase.database.ServerValue.TIMESTAMP
                    });
                },
                err => console.error("GPS Error", err),
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }

        window.markStop = function(status) {
            if (currentIndex < stops.length) {
                const stop = stops[currentIndex];
                db.ref(`routes/route_${truckId}/stops/${stop.id}`).update({
                    status: status
                });
                stops[currentIndex].status = status;
                currentIndex++;
                render();
                window.scrollTo(0,0);
            }
        };

        window.resetRoute = function() {
            if (confirm("Are you sure you want to reset all progress for this route?")) {
                let updates = {};
                stops.forEach(s => {
                    updates[s.id + '/status'] = 'PENDING';
                });
                db.ref(`routes/route_${truckId}/stops`).update(updates);
            }
        };

        function renderError(msg) {
            app.innerHTML = `
                <div class="header">
                    <h1><i class="fa-solid fa-truck"></i> Truck ${truckId}</h1>
                </div>
                <div class="card empty-state">
                    <i class="fa-solid fa-satellite-dish" style="color:var(--primary); font-size:48px;"></i>
                    <h2 style="margin-top:16px;">Live Sync Active</h2>
                    <p style="color:var(--text-muted); margin:16px 0 24px;">${msg}</p>
                </div>
            `;
        }

        function render() {
            if (currentIndex >= stops.length) {
                renderComplete();
                return;
            }

            const stop = stops[currentIndex];
            const isLast = currentIndex === stops.length - 1;
            const mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lng}&travelmode=driving`;

            let overviewHtml = stops.map((s, idx) => {
                let icon = '<i class="fa-regular fa-circle status-icon pending"></i>';
                let classes = 'stop-item';
                if (idx < currentIndex) {
                    if (s.status === 'SKIPPED') {
                        icon = '<i class="fa-solid fa-circle-xmark status-icon skipped"></i>';
                    } else {
                        icon = '<i class="fa-solid fa-circle-check status-icon completed"></i>';
                    }
                    classes += ' completed';
                } else if (idx === currentIndex) {
                    icon = '<i class="fa-solid fa-location-dot status-icon" style="color:var(--primary);"></i>';
                    classes += ' active';
                }
                
                return `
                    <div class="${classes}">
                        ${icon}
                        <div style="flex:1;">
                            <div style="font-weight:600;">Stop ${s.sequence || (idx+1)}: ${s.name}</div>
                        </div>
                    </div>
                `;
            }).join('');

            app.innerHTML = `
                <div class="header">
                    <h1><i class="fa-solid fa-truck"></i> Truck ${truckId}</h1>
                    <button onclick="resetRoute()" style="background:none; border:none; color:var(--text-muted); font-size:14px; font-weight:600; cursor:pointer;">Reset</button>
                </div>

                <div class="card">
                    <div class="progress-text">Stop ${currentIndex + 1} of ${stops.length}</div>
                    <h2 class="stop-name">${stop.name}</h2>
                    <div class="stop-address">
                        <i class="fa-solid fa-location-dot" style="margin-top:4px;"></i>
                        <span>${stop.address || 'No address provided'}</span>
                    </div>

                    <a href="${mapUrl}" target="_blank" class="btn btn-primary">
                        <i class="fa-solid fa-location-arrow"></i> Open Navigation
                    </a>

                    <div style="display:flex; gap:12px; margin-top:24px;">
                        <button class="btn btn-success" onclick="markStop('COMPLETED')" style="flex:2;">
                            <i class="fa-solid fa-check"></i> ${isLast ? 'Complete Route' : 'Complete & Next'}
                        </button>
                        <button class="btn btn-danger" onclick="markStop('SKIPPED')" style="flex:1;">
                            <i class="fa-solid fa-forward-step"></i> Skip
                        </button>
                    </div>
                </div>

                <div>
                    <div class="overview-title">
                        <h3>Route Overview <span style="font-size:12px; font-weight:normal; color:var(--green);">● Live Sync</span></h3>
                    </div>
                    <div class="stop-list">
                        ${overviewHtml}
                    </div>
                </div>
            `;
        }

        function renderComplete() {
            let completed = stops.filter(s => s.status !== 'SKIPPED').length;
            let skipped = stops.filter(s => s.status === 'SKIPPED').length;
            
            app.innerHTML = `
                <div class="header">
                    <h1><i class="fa-solid fa-truck"></i> Truck ${truckId}</h1>
                    <button onclick="resetRoute()" style="background:none; border:none; color:var(--text-muted); font-size:14px; font-weight:600; cursor:pointer;">Reset</button>
                </div>
                
                <div class="card empty-state" style="padding-top:60px;">
                    <i class="fa-solid fa-flag-checkered" style="color:var(--green); font-size:64px;"></i>
                    <h2 style="font-size:32px; margin-bottom:8px;">Route Complete!</h2>
                    <p style="color:var(--text-muted); font-size:16px;">You've finished all stops for this truck.</p>
                    
                    <div style="display:flex; justify-content:center; gap:32px; margin:32px 0;">
                        <div>
                            <div style="font-size:32px; font-weight:800; font-family:'Manrope'; color:var(--text-main);">${completed}</div>
                            <div style="font-size:13px; color:var(--text-muted); font-weight:600; text-transform:uppercase;">Completed</div>
                        </div>
                        <div>
                            <div style="font-size:32px; font-weight:800; font-family:'Manrope'; color:var(--text-main);">${skipped}</div>
                            <div style="font-size:13px; color:var(--text-muted); font-weight:600; text-transform:uppercase;">Skipped</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Initialize Firebase Offline Persistence explicitly (default is on for web, but good to ensure)
        // Note: For full offline support in v8 compat, we would need to add indexDB persistence, but 
        // Realtime Database automatically handles offline queueing in memory until reconnected.
        
        init();
    </script>
</body>
</html>
