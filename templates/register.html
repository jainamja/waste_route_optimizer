<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Account &mdash; TrashTrekyx</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        .theme-toggle-fixed {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .register-card {
            background: var(--bg-surface);
            padding: 44px 36px;
            border-radius: 20px;
            box-shadow: var(--shadow-hover);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            transition: all 0.25s ease;
        }

        .brand-badge {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px auto;
            border-radius: 14px;
            background: var(--success-subtle);
            color: var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
        }

        .register-card h2 {
            font-family: 'Manrope', sans-serif;
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 8px 0;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .register-card p {
            color: var(--text-muted);
            margin: 0 0 28px 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .flash {
            background: var(--danger-subtle);
            color: var(--danger-text);
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(239, 68, 68, 0.25);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap i.prefix-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }

        .input-wrap input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrap input:focus {
            border-color: var(--success);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px 20px;
            background: var(--success);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn:hover {
            background: var(--success-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        .link:hover {
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 32px 22px;
            }
        }
    </style>
</head>
<body>
    <div class="theme-toggle-fixed">
        <button type="button" class="theme-toggle-btn" onclick="window.toggleTheme()" aria-label="Toggle theme" title="Switch Light/Dark Mode">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <div class="register-card">
        <div class="brand-badge">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2>Create Account</h2>
        <p>Register as a new user in TrashTrekyx</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/register">
            <div class="form-group">
                <label for="username-reg">Choose a Username</label>
                <div class="input-wrap">
                    <i class="fa-regular fa-user prefix-icon"></i>
                    <input type="text" id="username-reg" name="username" required autocomplete="username" placeholder="Username">
                </div>
            </div>
            <div class="form-group">
                <label for="password-reg">Choose a Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock prefix-icon"></i>
                    <input type="password" id="password-reg" name="password" required autocomplete="new-password" placeholder="Password">
                </div>
            </div>
            <button type="submit" class="btn">Create Account</button>
        </form>

        <a href="/login" class="link"><i class="fa-solid fa-arrow-left"></i> Back to Sign In</a>
    </div>
</body>
</html>
