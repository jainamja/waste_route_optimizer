<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="/static/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0;
            background-color: #121212; color: #f3f4f6;
            display: flex; align-items: center; justify-content: center; height: 100vh;
        }
        .login-card {
            background: #1c1c1e;
            border-radius: 12px; padding: 40px;
            border: 1px solid #2c2c2e;
            width: 100%; max-width: 400px;
            text-align: center;
        }
        .login-card h2 { margin-top: 0; font-size: 24px; color: #ffffff; margin-bottom: 25px; display:flex; justify-content:center; align-items:center; gap:10px;}
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #d1d5db; }
        input[type="text"], input[type="password"] {
            width: 100%; padding: 12px;
            background: #2c2c2e; border: 1px solid #3f3f46;
            color: #ffffff; border-radius: 8px; font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); outline: none; }
        
        .btn { 
            display: block; width: 100%; padding: 14px; 
            background: #10b981; color: #ffffff; 
            border: none; border-radius: 8px; 
            font-size: 16px; font-weight: 600; cursor: pointer; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
        }
        .btn:hover { background: #059669; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        
        .flash { background: #fee2e2; color: #ef4444; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; border: 1px solid #f87171;}
        
        .link { display: block; margin-top: 20px; font-size: 14px; color: #9ca3af; text-decoration: none; }
        .link:hover { color: #d1d5db; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2><i class="fa-solid fa-user-plus" style="color: #10b981;"></i> Register</h2>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/register">
            <div class="form-group">
                <label>Choose a Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Choose a Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">Create Account</button>
        </form>
        
        <a href="/login" class="link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
    </div>
</body>
</html>
