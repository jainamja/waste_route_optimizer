<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Fleet Tracking</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --primary: #2F5FFF;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.05);
            --shadow-glow: 0 4px 20px rgba(47, 95, 255, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; }
        
        .header-bar {
            background: white; padding: 16px 32px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        
        .title-area { display: flex; align-items: center; gap: 16px; }
        .title-area h1 { font-family: 'Manrope', sans-serif; font-size: 24px; color: var(--text-main); margin:0; line-height:1;}
        
        .btn {
            padding: 10px 20px; border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
            cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; border:none;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: var(--shadow-glow); }
        .btn-outline { background: white; border: 1px solid var(--border); color: var(--text-main); }
        
        #map { flex: 1; width: 100%; z-index: 1;}
        
        .pulse {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #ef4444; margin-right: 8px;
            animation: pulse-animation 2s infinite;
        }
        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="title-area">
            <img src="/static/logo.jpg" alt="Logo" style="height: 32px; border-radius: 8px;">
            <div style="display: flex; flex-direction: column;">
                <h1>Live Fleet Tracking</h1>
                <span style="font-size: 11px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px; margin-top: 4px;">REAL-TIME GPS</span>
            </div>
            <div style="margin-left:16px; display:flex; align-items:center; font-weight:600; font-size:14px; color:#ef4444;">
                <span class="pulse"></span> LIVE
            </div>
        </div>
        <div style="display:flex; gap:12px; align-items:center;">
            <button onclick="aiRebalance()" id="btn-rebalance" class="btn" style="background:#8b5cf6; color:white;"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Re-balance</button>
            <a href="/" class="btn btn-outline"><i class="fa-solid fa-house"></i> Control Panel</a>
            <a href="/routes" class="btn btn-primary"><i class="fa-solid fa-route"></i> Route Dashboard</a>
        </div>
    </div>
    
    <div id="map"></div>
    
    <script>
        let map = L.map('map').setView([23.0225, 72.5714], 12);
        L.tileLayer("https://{s}.google.com/vt/lyrs=m&hl=en&x={x}&y={y}&z={z}", {
            maxZoom: 20, subdomains:["mt0","mt1","mt2","mt3"]
        }).addTo(map);
        
        const firebaseConfig = {
            apiKey: "AIzaSyAhLnjh0gRa2pf29G90zr-6AMcjLjbQpPg",
            authDomain: "wasteroutelive.firebaseapp.com",
            projectId: "wasteroutelive",
            storageBucket: "wasteroutelive.firebasestorage.app",
            messagingSenderId: "141692937729",
            appId: "1:141692937729:web:66398f74c16562c5d58200"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let liveTruckMarkers = {};

        firebase.auth().signInAnonymously().then(() => {
            db.ref('trucks').on('value', snap => {
                let trucks = snap.val();
                if(!trucks) return;
                
                let bounds = L.latLngBounds();
                let hasLive = false;
                
                for(let tId in trucks) {
                    let truck = trucks[tId];
                    if(truck.status === 'online' && truck.currentLat && truck.currentLng) {
                        hasLive = true;
                        bounds.extend([truck.currentLat, truck.currentLng]);
                        
                        if(liveTruckMarkers[tId]) {
                            liveTruckMarkers[tId].setLatLng([truck.currentLat, truck.currentLng]);
                        } else {
                            let truckIcon = L.divIcon({
                                className: 'live-truck-icon',
                                html: `<div style='background-color:#2F5FFF; width:40px; height:40px; border-radius:50%; border:3px solid white; box-shadow:0 4px 10px rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center; color:white; font-size:18px;'><i class="fa-solid fa-truck"></i></div>`,
                                iconSize: [40, 40],
                                iconAnchor: [20, 20]
                            });
                            liveTruckMarkers[tId] = L.marker([truck.currentLat, truck.currentLng], {icon: truckIcon}).addTo(map);
                            liveTruckMarkers[tId].bindPopup("<b>Truck " + tId + "</b><br>Live GPS").openPopup();
                        }
                    } else {
                        if(liveTruckMarkers[tId]) {
                            map.removeLayer(liveTruckMarkers[tId]);
                            delete liveTruckMarkers[tId];
                        }
                    }
                }
                
                // Only pan if this is the first load and we haven't manually moved the map
                if (hasLive && !window.hasFitBounds) {
                    map.fitBounds(bounds, {padding: [50, 50], maxZoom: 15});
                    window.hasFitBounds = true;
                }
            });
        });
    </script>
<script>
        window.aiRebalance = function() {
            if(!confirm("Are you sure? This will pause all drivers and completely recalculate their remaining routes based on their CURRENT live GPS locations.")) return;
            
            const btn = document.getElementById('btn-rebalance');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Re-balancing...';
            btn.disabled = true;
            
            fetch('/api/ai_rebalance', { method: 'POST' })
                .then(r => r.json())
                .then(res => {
                    if(res.success) {
                        alert("Routes successfully re-balanced! The drivers' apps have been updated.");
                    } else {
                        alert("Error: " + res.error);
                    }
                })
                .catch(e => {
                    alert("Network error.");
                })
                .finally(() => {
                    btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> AI Re-balance';
                    btn.disabled = false;
                });
        }
</script>

</body>
</html>
