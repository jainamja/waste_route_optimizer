<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Fleet Telemetry & Radar - Waste Route Optimizer</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>
    
    <!-- App Design System -->
    <link rel="stylesheet" href="/static/css/app.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--bg-deep);
            color: var(--text-primary);
        }

        .header-bar {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            flex-shrink: 0;
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-icon-box {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: var(--accent-glow);
        }

        .live-pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--status-danger);
            box-shadow: 0 0 10px var(--status-danger);
            animation: radarLivePulse 1.6s infinite;
        }

        @keyframes radarLivePulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.4); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.8; }
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        #map {
            flex: 1;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: var(--bg-deep);
        }

        /* Mission Control Floating Sidebar */
        .progress-panel {
            width: 420px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-left: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            z-index: 500;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.35);
            overflow-y: auto;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .panel-header {
            padding: 18px 20px;
            background: var(--bg-surface-elevated);
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .fleet-summary {
            display: flex;
            justify-content: space-between;
            text-align: center;
            margin-top: 14px;
            gap: 8px;
        }

        .fleet-stat {
            flex: 1;
            padding: 8px 4px;
            background: var(--bg-surface);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
        }

        .fleet-stat-val {
            font-size: 20px;
            font-weight: 700;
            font-family: var(--font-mono);
            line-height: 1;
        }

        .fleet-stat-label {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .prog-bar-wrap {
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-pill);
            display: flex;
            overflow: hidden;
            margin-top: 14px;
        }

        .prog-bar-comp { background: var(--status-completed); }
        .prog-bar-skip { background: var(--status-danger); }
        .prog-bar-canc { background: var(--status-warning); }

        .truck-filter-bar {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-glass);
            align-items: center;
            scrollbar-width: none;
        }

        .truck-filter-pill {
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-glass);
            background: var(--bg-surface-elevated);
            color: var(--text-secondary);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            transition: var(--transition-smooth);
        }

        .truck-filter-pill:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .truck-filter-pill.active {
            background: var(--accent-primary);
            color: #ffffff;
            border-color: var(--accent-primary);
            box-shadow: var(--accent-glow);
        }

        .truck-list {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .t-card {
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-card);
            padding: 16px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .t-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .t-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: var(--radius-pill);
            letter-spacing: 0.3px;
        }

        .t-pill.online {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .t-pill.offline {
            background: rgba(148, 163, 184, 0.12);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .t-pill.finished {
            background: var(--accent-gradient);
            color: #ffffff;
        }

        .t-stats {
            font-size: 13px;
            font-weight: 600;
            margin-top: 10px;
            color: var(--text-primary);
            font-family: var(--font-mono);
        }

        .t-expanded {
            display: none;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border-glass);
        }

        .t-card.expanded .t-expanded {
            display: block;
        }

        .list-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .cust-row {
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-glass);
        }

        .cust-row:last-child {
            border-bottom: none;
        }

        .btn-route-toggle, .btn-chat-toggle {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid var(--border-glass);
            background: var(--bg-surface);
            color: var(--text-secondary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: var(--transition-smooth);
        }

        .btn-route-toggle:hover, .btn-chat-toggle:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-route-toggle.active {
            background: var(--accent-primary);
            color: #ffffff;
            border-color: var(--accent-primary);
        }

        /* Marker Glide */
        .leaflet-marker-icon {
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            will-change: transform;
        }

        /* Messenger Window Mission Control */
        .admin-chat-bubble {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
        }

        .admin-chat-bubble.driver {
            align-self: flex-start;
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border-glass);
            border-bottom-left-radius: 4px;
        }

        .admin-chat-bubble.admin {
            align-self: flex-end;
            background: var(--accent-gradient);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            box-shadow: var(--accent-glow);
        }

        .admin-quick-chip {
            padding: 5px 11px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 16px;
            border: 1px solid var(--border-glass);
            background: var(--bg-surface-elevated);
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition-smooth);
        }

        .admin-quick-chip:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        @media (max-width: 768px) {
            .main-content { flex-direction: column; }
            .progress-panel {
                position: absolute;
                bottom: 0; left: 0; right: 0;
                width: 100%; height: auto; max-height: 75vh;
                border-left: none;
                border-top: 1px solid var(--border-glass);
                border-radius: 20px 20px 0 0;
            }
            .progress-panel.collapsed {
                transform: translateY(calc(100% - 68px));
            }
        }
    </style>
</head>
<body>
    <!-- Mission Control Header -->
    <header class="header-bar">
        <div class="title-area">
            <div class="brand-icon-box">
                <i data-lucide="radio" style="width: 20px; height: 20px;"></i>
            </div>
            <div>
                <h1 style="font-size: 18px; font-weight: 800; margin: 0; letter-spacing: -0.3px;">Live Fleet Telemetry</h1>
                <div style="font-size: 11px; color: var(--text-muted); font-family: var(--font-mono);">GPS SYNC ENGINE ACTIVE</div>
            </div>
            <div class="badge-status active" style="margin-left: 10px;">
                <span class="live-pulse-dot"></span>
                <span>REALTIME RADAR</span>
            </div>
        </div>

        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <button onclick="toggleAdminChatWidget()" id="btn-admin-messages" class="btn-control btn-secondary" style="position: relative;">
                <i data-lucide="message-square" style="width: 16px; height: 16px;"></i>
                <span>Messages</span>
                <span id="global-unread-badge" style="display: none; position: absolute; top: -6px; right: -6px; background: #ef4444; color: white; font-size: 10px; font-weight: 800; border-radius: 12px; min-width: 18px; height: 18px; padding: 0 5px; align-items: center; justify-content: center;">0</span>
            </button>

            <button onclick="toggleAllRoutes()" id="btn-toggle-all-routes" class="btn-control btn-secondary">
                <i data-lucide="route" style="width: 16px; height: 16px;"></i>
                <span>All Routes</span>
            </button>

            <button onclick="aiRebalance()" id="btn-rebalance" class="btn-control btn-secondary" title="Recalculate routes based on live GPS positions">
                <i data-lucide="sparkles" style="width: 16px; height: 16px; color: var(--accent-primary);"></i>
                <span>AI Re-balance</span>
            </button>

            <button type="button" class="btn-control btn-secondary theme-toggle-btn" onclick="toggleThemeAndMap()" title="Toggle Dark/Light Mode">
                <i data-lucide="sun" style="width: 16px; height: 16px;"></i>
            </button>

            <a href="/routes" class="btn-control btn-primary">
                <i data-lucide="map" style="width: 16px; height: 16px;"></i>
                <span>Route Deck</span>
            </a>

            <a href="/dashboard" class="btn-control btn-secondary">
                <i data-lucide="layout-dashboard" style="width: 16px; height: 16px;"></i>
                <span>Dashboard</span>
            </a>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-content">
        <div id="map"></div>

        <!-- Collapsible Progress Sidebar -->
        <aside id="progress-panel" class="progress-panel collapsed">
            <div class="panel-header" onclick="this.parentElement.classList.toggle('collapsed')">
                <div style="width: 40px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 0 auto 10px auto;"></div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="font-size: 16px; font-weight: 800; margin: 0;">Fleet Mission Progress</h3>
                    <span class="badge-status active">LIVE</span>
                </div>
                <div class="fleet-summary" id="fleet-summary"></div>
                <div class="prog-bar-wrap" id="fleet-prog-bar"></div>
            </div>

            <div class="truck-filter-bar" id="truck-filter-bar"></div>
            <div class="truck-list" id="truck-list"></div>
        </aside>
    </main>

    <!-- Admin Floating Toast Notification -->
    <div id="admin-message-toast" style="display: none; position: fixed; top: 80px; right: 24px; max-width: 380px; background: var(--bg-surface-elevated); color: var(--text-primary); border-radius: 14px; padding: 14px 18px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); z-index: 10000; border-left: 4px solid var(--accent-primary); border: 1px solid var(--border-glass);">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="width: 8px; height: 8px; border-radius: 50%; background: #10b981;"></span>
                <span id="admin-toast-sender" style="font-size: 13px; font-weight: 700;">Driver</span>
            </div>
            <button onclick="dismissAdminToast()" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px;">&times;</button>
        </div>
        <div id="admin-toast-text" style="font-size: 13px; color: var(--text-secondary); margin-top: 6px; word-break: break-word;"></div>
        <div style="margin-top: 10px; display: flex; justify-content: flex-end;">
            <button id="admin-toast-btn" class="btn-control btn-primary" style="padding: 6px 12px; font-size: 12px;">Open Dispatch Chat</button>
        </div>
    </div>

    <!-- Admin Chat Docked Window -->
    <div id="admin-chat-widget" style="display: none; position: fixed; bottom: 20px; right: 20px; width: 400px; max-width: calc(100vw - 32px); height: 540px; max-height: 85vh; background: var(--bg-surface); border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid var(--border-glass); z-index: 9999; flex-direction: column; overflow: hidden;">
        <div style="background: var(--bg-surface-elevated); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-glass);">
            <div style="display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1;">
                <div style="width: 36px; height: 36px; border-radius: 10px; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; color: white;">
                    <i data-lucide="truck" style="width: 18px; height: 18px;"></i>
                </div>
                <div style="min-width: 0; flex: 1;">
                    <div id="admin-chat-header-title" style="font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Truck • Driver</div>
                    <div id="admin-chat-header-status" style="font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-top: 2px;">
                        <span style="width: 6px; height: 6px; border-radius: 50%; background: #10b981;"></span> Active

            </div>
            <button onclick="closeAdminChatWidget()" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px;">
                <i data-lucide="x" style="width: 18px; height: 18px;"></i>
            </button>
        </div>

        <div id="admin-chat-messages" style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--bg-deep);"></div>

        <div style="background: var(--bg-surface-elevated); border-top: 1px solid var(--border-glass); padding: 8px 12px; display: flex; gap: 6px; overflow-x: auto; white-space: nowrap;">
            <button onclick="sendAdminCanned('📞 Please call dispatch when safe.')" class="admin-quick-chip">📞 Call Dispatch</button>
            <button onclick="sendAdminCanned('📍 What is your current status/ETA?')" class="admin-quick-chip">📍 Status / ETA?</button>
            <button onclick="sendAdminCanned('⚠️ Road delay reported. Proceed carefully.')" class="admin-quick-chip">⚠️ Road Delay</button>
            <button onclick="sendAdminCanned('✅ Route updated. Please refresh stop list.')" class="admin-quick-chip">✅ Route Updated</button>

        <form onsubmit="event.preventDefault(); sendAdminChat();" style="display: flex; gap: 8px; padding: 12px 14px; background: var(--bg-surface); border-top: 1px solid var(--border-glass); align-items: center;">
            <input type="text" id="admin-chat-input" placeholder="Type message to driver..." autocomplete="off" style="flex: 1; height: 40px; padding: 0 14px; background: var(--bg-surface-elevated); border: 1px solid var(--border-glass); border-radius: 20px; font-size: 13px; color: var(--text-primary); outline: none;">
            <button type="submit" class="btn-control btn-primary" style="width: 40px; height: 40px; border-radius: 50%; padding: 0;">

            </button>
        </form>

    <!-- Core App JS -->
    <script src="/static/js/app.js"></script>

    <!-- Tracking Engine Logic -->
    <script>
        let map = null;
        let mapTileLayer = null;

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([23.0225, 72.5714], 12);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            updateMapTheme();
        }

        function updateMapTheme() {
            if (!map) return;
            if (mapTileLayer) map.removeLayer(mapTileLayer);

            const isRetina = (window.devicePixelRatio && window.devicePixelRatio > 1.2);
            const scaleParam = isRetina ? '&scale=2' : '';
            const tileUrl = `https://{s}.google.com/vt/lyrs=m&hl=en&x={x}&y={y}&z={z}${scaleParam}`;

            mapTileLayer = L.tileLayer(tileUrl, {
                maxZoom: 20,
                subdomains: ["mt0", "mt1", "mt2", "mt3"],
                tileSize: 256,
                zoomOffset: 0,
                attribution: 'Map data &copy; Google'
            }).addTo(map);
        }

        function toggleThemeAndMap() {
            toggleTheme();
            updateMapTheme();
        }

        initMap();

        // Firebase Configuration Preserved
        const firebaseConfig = {
            apiKey: "AIzaSyAhLnjh0gRa2pf29G90zr-6AMcjLjbQpPg",
            authDomain: "wasteroutelive.firebaseapp.com",
            projectId: "wasteroutelive",
            storageBucket: "wasteroutelive.firebasestorage.app",
            messagingSenderId: "141692937729",
            appId: "1:141692937729:web:66398f74c16562c5d58200"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let liveTruckMarkers = {};
        let visibleRouteTrucks = new Set();
        let activeRouteLayers = {};
        let routeRenderTokens = {};

        const TRUCK_COLORS = [
            '#10b981', '#38bdf8', '#a855f7', '#f59e0b', '#ec4899', '#6366f1', '#14b8a6', '#f97316', '#84cc16', '#06b6d4'
        ];

        function getTruckColor(tId) {
            let n = parseInt(tId);
            if (isNaN(n) || n < 1) n = 1;
            return TRUCK_COLORS[(n - 1) % TRUCK_COLORS.length];
        }

        let usingFallback = false;
        let driverMap = {};
        let truckToDriver = {};
        let driverAssignedRoutes = {};
        let driverAssignedTemplateNames = {};
        let driversLoaded = false;
        let routesData = {};

        firebase.auth().signInAnonymously().then(() => {
            if (!window.liveTrucks) window.liveTrucks = {};

            function mergeTruckData(key, data) {
                if (!data || !key) return;
                let existing = window.liveTrucks[key];
                let newTs = Number(data.lastUpdated || data.timestamp || 0);
                let oldTs = Number(existing?.lastUpdated || existing?.timestamp || 0);
                
                if (!existing || newTs >= oldTs || (oldTs - newTs < 3000)) {
                    window.liveTrucks[key] = Object.assign(existing || {}, data);
                }
            }

            db.ref('driver_locations').on('value', snap => {
                let locs = snap.val() || {};
                for (let k in locs) {
                    if (locs[k]) {
                        mergeTruckData(k, locs[k]);
                        if (locs[k].truckId) mergeTruckData(String(locs[k].truckId), locs[k]);
                    }
                }
                scheduleRender();
            }, err => {
                console.warn("driver_locations fallback", err);
                usingFallback = true;
                fallbackToIndividualListeners();
            });

            db.ref('trucks').on('value', snap => {
                let tData = snap.val() || {};
                for (let tId in tData) {
                    if (tData[tId]) {
                        mergeTruckData(String(tId), tData[tId]);
                        let dId = truckToDriver[tId];
                        if (dId) mergeTruckData(String(dId), tData[tId]);
                    }
                }
                scheduleRender();
            }, err => {
                usingFallback = true;
                fallbackToIndividualListeners();
            });

            attachRoutesListener();
            fetchDrivers();
        }).catch(e => console.error("Firebase auth failed:", e));

        function fetchDrivers() {
            fetch('/api/data').then(r => r.json()).then(data => {
                let drvs = data.drivers || [];
                driverMap = {};
                truckToDriver = {};
                driverAssignedRoutes = {};
                driverAssignedTemplateNames = {};
                drvs.forEach(d => {
                    if (d.truck_id) {
                        driverMap[d.truck_id] = d.name || d.username;
                        truckToDriver[d.truck_id] = d.id;
                        driverAssignedRoutes[d.truck_id] = d.assigned_template_id || null;
                        driverAssignedTemplateNames[d.truck_id] = d.assigned_template_name || null;
                    }
                });
                driversLoaded = true;
                if (usingFallback) fallbackToIndividualListeners();
                scheduleRender();
            }).catch(e => {
                driversLoaded = true;
                scheduleRender();
            });
        }
        setInterval(fetchDrivers, 60000);

        function parseStops(stopsObj) {
            let stops = [];
            const isValidCustomerStop = (val, id) => {
                if (!val || typeof val !== 'object') return false;
                if (!val.name || typeof val.name !== 'string' || !val.name.trim()) return false;
                if (val.name === 'End Location / Depot') return false;
                let isInactive = (val.customer_status || 'ACTIVE').toUpperCase() === 'INACTIVE';
                if (isInactive) return false;
                let numId = parseInt(id !== undefined ? id : val.id);
                if (!isNaN(numId) && numId <= -1000) return false;
                return true;
            };

            if (Array.isArray(stopsObj)) {
                stopsObj.forEach((val, idx) => {
                    if (isValidCustomerStop(val, idx)) {
                        val.id = val.id !== undefined ? val.id : idx;
                        stops.push(val);
                    }
                });
            } else if (typeof stopsObj === 'object' && stopsObj !== null) {
                Object.keys(stopsObj).forEach(key => {
                    let val = stopsObj[key];
                    if (isValidCustomerStop(val, key)) {
                        val.id = val.id !== undefined ? val.id : parseInt(key);
                        stops.push(val);
                    }
                });
            }
            return stops.sort((a,b) => (parseInt(a.sequence) || 0) - (parseInt(b.sequence) || 0));
        }

        function extractDepotStop(stopsObj) {
            if (Array.isArray(stopsObj)) {
                for (let idx = 0; idx < stopsObj.length; idx++) {
                    let val = stopsObj[idx];
                    if (val && ((val.id !== undefined && parseInt(val.id) <= -1000) || val.name === 'End Location / Depot')) {
                        if (val.lat !== undefined && val.lng !== undefined && !isNaN(parseFloat(val.lat)) && !isNaN(parseFloat(val.lng))) {
                            return val;
                        }
                    }
                }
            } else if (typeof stopsObj === 'object' && stopsObj !== null) {
                for (let key of Object.keys(stopsObj)) {
                    let val = stopsObj[key];
                    if (val && (parseInt(key) <= -1000 || (val.id !== undefined && parseInt(val.id) <= -1000) || val.name === 'End Location / Depot')) {
                        if (val.lat !== undefined && val.lng !== undefined && !isNaN(parseFloat(val.lat)) && !isNaN(parseFloat(val.lng))) {
                            return val;
                        }
                    }
                }
            }
            return null;
        }

        function attachRoutesListener() {
            db.ref('routes').on('value', snap => {
                routesData = snap.val() || {};
                scheduleRender();
            }, err => {
                usingFallback = true;
                fallbackToIndividualListeners();
            });
        }

        let routeListeners = {};
        function fallbackToIndividualListeners() {
            if (!window.liveTrucks) window.liveTrucks = {};
            let keys = Object.keys(driverMap);
            for (let rk in routesData) {
                if (rk.startsWith('route_')) keys.push(rk.replace('route_', ''));
            }
            keys = Array.from(new Set(keys));

            keys.forEach(tId => {
                if (!tId || isNaN(parseInt(tId))) return;
                let driverId = truckToDriver[tId];

                if (!routeListeners[tId]) {
                    routeListeners[tId] = true;
                    db.ref('routes/route_' + tId + '/stops').on('value', snap => {
                        let val = snap.val();
                        if (!routesData['route_' + tId]) routesData['route_' + tId] = {};
                        routesData['route_' + tId].stops = val || {};
                        scheduleRender();
                    });
                    
                    db.ref('trucks/' + tId).on('value', snap => {
                        let tData = snap.val();
                        if (tData) {
                            window.liveTrucks[tId] = Object.assign(window.liveTrucks[tId] || {}, tData);
                            let dId = truckToDriver[tId] || driverId;
                            if (dId) window.liveTrucks[dId] = Object.assign(window.liveTrucks[dId] || {}, tData);
                            scheduleRender();
                        }
                    });
                }

                if (driverId && !routeListeners['drv_' + driverId]) {
                    routeListeners['drv_' + driverId] = true;
                    db.ref('driver_locations/' + driverId).on('value', snap => {
                        let tData = snap.val();
                        if (tData) {
                            window.liveTrucks[driverId] = Object.assign(window.liveTrucks[driverId] || {}, tData);
                            window.liveTrucks[tId] = Object.assign(window.liveTrucks[tId] || {}, tData);
                            scheduleRender();
                        }
                    });
                }
            });
        }

        let renderTimer = null;
        function scheduleRender() {
            if (renderTimer) return;
            renderTimer = setTimeout(() => {
                renderTimer = null;
                renderProgress();
            }, 200);
        }
        
        let truckStats = {};

        function getTruckData(tId) {
            if (!tId) return null;
            let trucks = window.liveTrucks || {};
            let strTId = String(tId);
            let dId = truckToDriver[tId] || truckToDriver[strTId];
            let strDId = dId ? String(dId) : null;
            
            let candidates = [];
            [trucks[tId], trucks[strTId], dId ? trucks[dId] : null, strDId ? trucks[strDId] : null].forEach(node => {
                if (node && (node.currentLat !== undefined || node.lat !== undefined || node.latitude !== undefined)) {
                    candidates.push(node);
                }
            });
            
            for (let k in trucks) {
                let node = trucks[k];
                if (!node) continue;
                if (String(node.truckId) === strTId || String(node.truck_id) === strTId || (strDId && String(node.driverId) === strDId)) {
                    if (node.currentLat !== undefined || node.lat !== undefined || node.latitude !== undefined) {
                        candidates.push(node);
                    }
                }
            }
            if (candidates.length === 0) return null;
            candidates.sort((a, b) => (Number(b.lastUpdated || b.timestamp || 0) - Number(a.lastUpdated || a.timestamp || 0)));
            return candidates[0];
        }

        function getTruckCoords(truckData) {
            if (!truckData) return null;
            let lat = truckData.currentLat !== undefined ? truckData.currentLat : (truckData.lat !== undefined ? truckData.lat : truckData.latitude);
            let lng = truckData.currentLng !== undefined ? truckData.currentLng : (truckData.lng !== undefined ? truckData.lng : truckData.longitude);
            if (lat !== undefined && lng !== undefined && !isNaN(parseFloat(lat)) && !isNaN(parseFloat(lng))) {
                lat = parseFloat(lat);
                lng = parseFloat(lng);
                if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180 && (lat !== 0 || lng !== 0)) {
                    return [lat, lng];
                }
            }
            return null;
        }

        function isTruckOnline(truckData) {
            if (!truckData) return false;
            if (truckData.status === 'offline') return false;
            if (truckData.routeCompleted && truckData.status !== 'online') return false;
            let ts = truckData.lastUpdated || truckData.timestamp;
            if (!ts) return false;
            let diff = Date.now() - Number(ts);
            if (diff > 120000) return false;
            if (truckData.status === 'online') return true;
            return diff < 60000;
        }

        function renderProgress() {
            if (!driversLoaded) return;
            let trucks = window.liveTrucks || {};
            let activeTruckIds = new Set([
                ...Object.keys(driverMap),
                ...Object.keys(truckToDriver),
                ...Object.keys(routesData).map(k => k.replace('route_', ''))
            ]);
            for (let k in trucks) {
                let t = trucks[k];
                if (t && (t.truckId || t.truck_id)) {
                    activeTruckIds.add(String(t.truckId || t.truck_id));
                }
            }
            
            let fleetTotal = 0, fleetComp = 0, fleetSkip = 0, fleetCanc = 0;
            let cardsHtml = '';
            let tIds = Array.from(activeTruckIds).sort((a,b) => parseInt(a)-parseInt(b));
            let validTruckIds = new Set();
            
            tIds.forEach(tId => {
                if (!tId || tId === 'undefined' || isNaN(parseInt(tId))) return;
                
                let strId = String(tId);
                let hasAssignedRoute = Boolean(driverAssignedRoutes[tId] || driverAssignedRoutes[strId]);
                let routeNode = hasAssignedRoute ? (routesData['route_' + tId] || routesData['route_' + strId] || {}) : {};
                let stopsObj = routeNode.stops || routeNode;
                let stops = hasAssignedRoute ? parseStops(stopsObj) : [];
                
                let realStops = stops.filter(s => s.id > -1000 && s.name !== 'End Location / Depot');
                let tData = getTruckData(tId);
                let isOnline = isTruckOnline(tData);
                
                if (!hasAssignedRoute || realStops.length === 0) return;
                
                let dName = driverMap[tId] || driverMap[strId] || (tData && tData.driverName) || 'Unassigned';
                validTruckIds.add(tId.toString());
                if (typeof ensureAdminTruckMessageListener === 'function') ensureAdminTruckMessageListener(tId);
                let tUnread = typeof getTruckUnreadCount === 'function' ? getTruckUnreadCount(tId) : 0;
                
                let tTotal = realStops.length;
                let tComp = 0, tSkip = 0, tCanc = 0, tLeft = 0, tNotConf = 0;
                let skipList = [], leftList = [], compList = [];
                
                realStops.forEach(s => {
                    if (s.confirmation === 'CANCELLED') tCanc++;
                    else if (s.status === 'COMPLETED') { tComp++; compList.push(s); }
                    else if (s.status === 'SKIPPED') { tSkip++; skipList.push(s); }
                    else {
                        tLeft++;
                        if (leftList.length < 5) leftList.push(s);
                        if (s.confirmation === 'NOT_CONFIRMED') tNotConf++;
                    }
                });
                
                fleetTotal += tTotal;
                fleetComp += tComp;
                fleetSkip += tSkip;
                fleetCanc += tCanc;
                
                truckStats[tId] = { total: tTotal, comp: tComp, skip: tSkip, left: tLeft };
                let isFinished = (hasAssignedRoute && tTotal > 0 && tLeft === 0);
                if (isFinished && !isOnline) return;
                
                let pillHtml = '';
                if (isFinished) pillHtml = `<span class="t-pill finished">Finished</span>`;
                else if (isOnline) pillHtml = `<span class="t-pill online">Online</span>`;
                else pillHtml = `<span class="t-pill offline">Offline</span>`;
                
                let pctComp = tTotal > 0 ? (tComp / tTotal) * 100 : 0;
                let pctSkip = tTotal > 0 ? (tSkip / tTotal) * 100 : 0;
                
                let isRouteActive = visibleRouteTrucks.has(String(tId));
                let isCardExpanded = window.expandedTruckCards && window.expandedTruckCards.has(String(tId));
                let tColor = getTruckColor(tId);

                cardsHtml += `
                    <div class="t-card ${isRouteActive ? 'route-active' : ''} ${isCardExpanded ? 'expanded' : ''}" style="${isRouteActive ? `border-left: 4px solid ${tColor};` : ''}" onclick="handleCardClick('${tId}', event)">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span style="width: 10px; height: 10px; border-radius: 50%; background: ${tColor};"></span>
                                <span style="font-weight: 700; font-size: 15px;">Truck ${tId}</span>
                                <span style="font-size: 12px; color: var(--text-muted);">• ${dName}</span>
                            </div>
                            <div>${pillHtml}</div>
                        </div>

                        <div style="display: flex; gap: 8px; margin-bottom: 10px;" onclick="event.stopPropagation();">
                            <button onclick="toggleTruckRoute('${tId}');" class="btn-route-toggle ${isRouteActive ? 'active' : ''}" style="flex: 1;">
                                <i data-lucide="route" style="width: 14px; height: 14px;"></i> ${isRouteActive ? 'Hide Path' : 'Show Route'}
                            </button>
                            <button onclick="openAdminChat('${tId}', '${escapeAdminString(dName)}');" class="btn-chat-toggle" style="flex: 1;">
                                <i data-lucide="message-square" style="width: 14px; height: 14px;"></i> Chat
                                ${tUnread > 0 ? `<span class="badge-status danger" style="padding: 1px 6px; font-size: 10px;">${tUnread}</span>` : ''}
                            </button>
                        </div>

                        <div class="prog-bar-wrap">
                            <div class="prog-bar-comp" style="width: ${pctComp}%"></div>
                            <div class="prog-bar-skip" style="width: ${pctSkip}%"></div>
                        </div>
                        <div class="t-stats">${tComp} done • ${tLeft} left</div>
                    </div>
                `;
            });
            
            if (!cardsHtml) {
                cardsHtml = `<div style="text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px;">No active trucks currently online.</div>`;
            }
            
            document.getElementById('truck-list').innerHTML = cardsHtml;
            
            let filterBar = document.getElementById('truck-filter-bar');
            if (filterBar) {
                let allIds = getAllTrackableTruckIds();
                let allVisible = allIds.length > 0 && allIds.every(id => visibleRouteTrucks.has(String(id)));
                let filterHtml = `
                    <button onclick="toggleAllRoutes(true)" class="truck-filter-pill ${allVisible ? 'active' : ''}">
                        All Trucks
                    </button>
                `;
                allIds.forEach(id => {
                    let isSolo = (visibleRouteTrucks.size === 1 && visibleRouteTrucks.has(String(id)));
                    let c = getTruckColor(id);
                    filterHtml += `
                        <button onclick="focusTruckRoute('${id}')" class="truck-filter-pill ${isSolo ? 'active' : ''}">
                            <span style="width: 6px; height: 6px; border-radius: 50%; background: ${c}; display: inline-block; margin-right: 6px;"></span>
                            Truck ${id}
                        </button>
                    `;
                });
                filterBar.innerHTML = filterHtml;
            }
            
            let fleetLeft = fleetTotal - fleetComp - fleetSkip - fleetCanc;
            let fleetPct = fleetTotal > 0 ? Math.round((fleetComp / fleetTotal) * 100) : 0;
            
            document.getElementById('fleet-summary').innerHTML = `
                <div class="fleet-stat">
                    <div class="fleet-stat-val" style="color: #10b981;">${fleetComp}</div>
                    <div class="fleet-stat-label">Done</div>
                </div>
                <div class="fleet-stat">
                    <div class="fleet-stat-val" style="color: #ef4444;">${fleetSkip}</div>
                    <div class="fleet-stat-label">Skip</div>
                </div>
                <div class="fleet-stat">
                    <div class="fleet-stat-val">${fleetLeft}</div>
                    <div class="fleet-stat-label">Left</div>
                </div>
                <div class="fleet-stat">
                    <div class="fleet-stat-val" style="color: var(--accent-primary);">${fleetPct}%</div>
                    <div class="fleet-stat-label">Progress</div>
                </div>
            `;
            
            document.getElementById('fleet-prog-bar').innerHTML = `
                <div class="prog-bar-comp" style="width: ${fleetTotal > 0 ? (fleetComp/fleetTotal)*100 : 0}%"></div>
                <div class="prog-bar-skip" style="width: ${fleetTotal > 0 ? (fleetSkip/fleetTotal)*100 : 0}%"></div>
            `;

            updateMapPopups();
            if (window.lucide) lucide.createIcons();
        }

        function updateMapPopups() {
            let bounds = L.latLngBounds();
            let hasLive = false;
            
            let allTrackableTruckIds = new Set([
                ...Object.keys(truckStats),
                ...Object.keys(driverMap),
                ...Object.keys(truckToDriver)
            ]);
            let trucks = window.liveTrucks || {};
            for (let k in trucks) {
                let t = trucks[k];
                if (t) {
                    if (t.truckId) allTrackableTruckIds.add(String(t.truckId));
                    else if (t.truck_id) allTrackableTruckIds.add(String(t.truck_id));
                    else if (!isNaN(parseInt(k)) && parseInt(k) < 1000) allTrackableTruckIds.add(String(k));
                }
            }
            
            allTrackableTruckIds.forEach(tId => {
                if (!tId || isNaN(parseInt(tId))) return;
                let tData = getTruckData(tId);
                let coords = getTruckCoords(tData);
                let isOnline = isTruckOnline(tData);
                let strId = String(tId);
                let hasAssigned = Boolean(driverAssignedRoutes[tId] || driverAssignedRoutes[strId]);
                let st = truckStats[tId];
                let isFinished = (hasAssigned && st && st.total > 0 && st.left === 0);

                if (!coords || !isOnline || !hasAssigned || (isFinished && !isOnline)) {
                    if (liveTruckMarkers[tId]) {
                        map.removeLayer(liveTruckMarkers[tId]);
                        delete liveTruckMarkers[tId];
                    }
                    return;
                }
                
                let [lat, lng] = coords;
                let dName = driverMap[tId] || driverMap[strId] || (tData && tData.driverName) || 'Unassigned';
                let tColor = getTruckColor(tId);
                let iconColor = isOnline ? tColor : '#64748b';
                
                function createMarkerIcon() {
                    return L.divIcon({
                        className: 'live-truck-marker-' + tId,
                        html: `<div style="background-color: ${iconColor}; width: 38px; height: 38px; border-radius: 50%; border: 3px solid #ffffff; box-shadow: 0 4px 14px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; color: #ffffff; font-size: 14px; position: relative; cursor: pointer;">
                            <i data-lucide="truck" style="width: 18px; height: 18px;"></i>
                            ${isOnline ? '<span style="position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; background: #10b981; border: 2px solid white; border-radius: 50%;"></span>' : ''}
                        </div>`,
                        iconSize: [38, 38],
                        iconAnchor: [19, 19]
                    });
                }
                
                if (liveTruckMarkers[tId]) {
                    let currentLatLng = liveTruckMarkers[tId].getLatLng();
                    if (Math.abs(currentLatLng.lat - lat) > 0.00001 || Math.abs(currentLatLng.lng - lng) > 0.00001) {
                        liveTruckMarkers[tId].setLatLng([lat, lng]);
                    }
                    if (liveTruckMarkers[tId]._lastOnlineState !== isOnline) {
                        liveTruckMarkers[tId].setIcon(createMarkerIcon());
                        liveTruckMarkers[tId]._lastOnlineState = isOnline;
                    }
                } else {
                    liveTruckMarkers[tId] = L.marker([lat, lng], { icon: createMarkerIcon() }).addTo(map);
                    liveTruckMarkers[tId]._lastOnlineState = isOnline;
                    liveTruckMarkers[tId].bindPopup(`<b>Truck ${tId}</b>`);
                }
                
                let popupHtml = `
                    <div style="font-family: inherit; padding: 4px;">
                        <div style="font-weight: 700; font-size: 14px; color: var(--text-primary); display: flex; align-items: center; gap: 6px;">
                            <span style="width: 8px; height: 8px; border-radius: 50%; background: ${tColor};"></span>
                            Truck ${tId} (${dName})
                        </div>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">
                            ${isOnline ? '🟢 Online • Live' : '⚪ Offline'}
                        </div>
                    </div>
                `;
                let popup = liveTruckMarkers[tId].getPopup();
                if (popup && popup.getContent() !== popupHtml) {
                    popup.setContent(popupHtml);
                }
                
                hasLive = true;
                bounds.extend([lat, lng]);
            });
            
            for (let tId in liveTruckMarkers) {
                if (!allTrackableTruckIds.has(String(tId))) {
                    map.removeLayer(liveTruckMarkers[tId]);
                    delete liveTruckMarkers[tId];
                }
            }
            
            if (hasLive && !window.hasFitBounds) {
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
                window.hasFitBounds = true;
            }

            renderRoutesOnMap();
            if (window.lucide) lucide.createIcons();
        }

        setInterval(updateMapPopups, 1000);

        function getAllTrackableTruckIds() {
            let ids = new Set();
            for (let tid in driverAssignedRoutes) {
                if (driverAssignedRoutes[tid] && !isNaN(parseInt(tid))) {
                    ids.add(String(tid));
                }
            }
            return Array.from(ids).sort((a,b) => parseInt(a) - parseInt(b));
        }

        function focusTruckRoute(tId) {
            let strId = String(tId);
            let hasAssigned = Boolean(driverAssignedRoutes[tId] || driverAssignedRoutes[strId]);
            if (!hasAssigned) return;
            let allIds = getAllTrackableTruckIds();
            
            if (visibleRouteTrucks.size === 1 && visibleRouteTrucks.has(strId)) {
                allIds.forEach(id => visibleRouteTrucks.add(String(id)));
            } else {
                visibleRouteTrucks.clear();
                visibleRouteTrucks.add(strId);
            }
            
            renderRoutesOnMap();
            renderProgress();
            fitRouteBounds(strId);
        }

        function toggleTruckRoute(tId) {
            focusTruckRoute(tId);
        }

        function toggleAllRoutes() {
            let allIds = getAllTrackableTruckIds();
            if (allIds.length === 0) return;
            
            let allVisible = allIds.every(id => visibleRouteTrucks.has(String(id)));
            if (!allVisible) {
                visibleRouteTrucks.clear();
                allIds.forEach(id => visibleRouteTrucks.add(String(id)));
            } else {
                visibleRouteTrucks.clear();
            }
            renderRoutesOnMap();
            renderProgress();
        }

        function handleCardClick(tId, event) {
            if (event.target.closest('button') || event.target.closest('a')) return;
            let strId = String(tId);
            focusTruckRoute(strId);
        }

        const osrmGeometryCache = {};
        const inFlightOsrmRequests = new Set();

        function chunkWaypoints(waypoints, maxChunk = 35) {
            if (!waypoints || waypoints.length < 2) return [];
            if (waypoints.length <= maxChunk) return [waypoints];
            const chunks = [];
            const step = maxChunk - 1;
            for (let i = 0; i < waypoints.length - 1; i += step) {
                const slice = waypoints.slice(i, i + maxChunk);
                if (slice.length >= 2) chunks.push(slice);
                if (i + maxChunk >= waypoints.length) break;
            }
            return chunks;
        }

        async function fetchChunkedOsrmGeometry(waypoints) {
            const chunks = chunkWaypoints(waypoints, 35);
            if (!chunks.length) return null;
            try {
                const results = await Promise.all(chunks.map(chunk => {
                    const coordsStr = chunk.map(pt => `${pt[1]},${pt[0]}`).join(';');
                    return fetch(`https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`)
                        .then(res => res.json())
                        .then(d => (d && d.routes && d.routes[0]) ? d.routes[0].geometry.coordinates : null)
                        .catch(() => null);
                }));

                const mergedLatLngs = [];
                results.forEach(coords => {
                    if (coords && Array.isArray(coords)) {
                        coords.forEach(c => mergedLatLngs.push([c[1], c[0]]));
                    }
                });
                return mergedLatLngs.length > 0 ? mergedLatLngs : null;
            } catch(e) {
                return null;
            }
        }

        function renderRoutesOnMap() {
            for (let tId in activeRouteLayers) {
                if (!visibleRouteTrucks.has(String(tId))) {
                    const state = activeRouteLayers[tId];
                    if (state) {
                        if (state.stopsLine) { map.removeLayer(state.stopsLine); state.stopsLine = null; }
                        if (state.approachLine) { map.removeLayer(state.approachLine); state.approachLine = null; }
                        if (state.prelimLine) { map.removeLayer(state.prelimLine); state.prelimLine = null; }
                        if (state.markers) { state.markers.forEach(m => map.removeLayer(m)); state.markers = []; }
                    }
                    delete activeRouteLayers[tId];
                }
            }

            visibleRouteTrucks.forEach(strId => {
                const color = getTruckColor(strId);
                const routeNode = routesData['route_' + strId] || {};
                const stopsObj = routeNode.stops || routeNode;
                const stops = parseStops(stopsObj);
                const pendingStops = stops.filter(s => s.id > -1000 && s.name !== 'End Location / Depot' && s.status !== 'COMPLETED' && s.status !== 'SKIPPED' && s.confirmation !== 'CANCELLED');
                
                if (!activeRouteLayers[strId]) activeRouteLayers[strId] = { markers: [] };
                const state = activeRouteLayers[strId];
                state.markers.forEach(m => map.removeLayer(m));
                state.markers = [];

                pendingStops.forEach(s => {
                    if (s.lat && s.lng) {
                        let icon = L.divIcon({
                            className: 'custom-stop-marker',
                            html: `<div style="background: ${color}; color: white; border-radius: 6px; padding: 2px 6px; font-weight: 700; font-size: 11px; border: 2px solid white;">${s.sequence || s.stop_number || '•'}</div>`
                        });
                        let m = L.marker([parseFloat(s.lat), parseFloat(s.lng)], { icon: icon }).bindPopup(`<b>${s.name}</b>`).addTo(map);
                        state.markers.push(m);
                    }
                });

                let waypoints = pendingStops.map(s => [parseFloat(s.lat), parseFloat(s.lng)]);
                if (waypoints.length > 1) {
                    const stopsSig = strId + '_' + waypoints.length + '_' + waypoints[0].join(',') + '_' + waypoints[waypoints.length - 1].join(',');
                    
                    if (osrmGeometryCache[stopsSig]) {
                        // Render cached true road geometry
                        if (state.stopsLine) map.removeLayer(state.stopsLine);
                        state.stopsLine = L.polyline(osrmGeometryCache[stopsSig], {
                            color: color,
                            weight: 5,
                            opacity: 0.9,
                            lineCap: 'round',
                            lineJoin: 'round'
                        }).addTo(map);
                    } else {
                        // Solid line while road geometry fetches
                        if (!state.stopsLine) {
                            state.stopsLine = L.polyline(waypoints, {
                                color: color,
                                weight: 4,
                                opacity: 0.75,
                                lineCap: 'round',
                                lineJoin: 'round'
                            }).addTo(map);
                        }

                        if (!inFlightOsrmRequests.has(stopsSig)) {
                            inFlightOsrmRequests.add(stopsSig);
                            fetchChunkedOsrmGeometry(waypoints).then(roadLatLngs => {
                                inFlightOsrmRequests.delete(stopsSig);
                                if (roadLatLngs && roadLatLngs.length > 0) {
                                    osrmGeometryCache[stopsSig] = roadLatLngs;
                                    if (visibleRouteTrucks.has(strId)) {
                                        if (state.stopsLine) map.removeLayer(state.stopsLine);
                                        state.stopsLine = L.polyline(roadLatLngs, {
                                            color: color,
                                            weight: 5,
                                            opacity: 0.9,
                                            lineCap: 'round',
                                            lineJoin: 'round'
                                        }).addTo(map);
                                    }
                                }
                            });
                        }
                    }
                } else if (state.stopsLine) {
                    map.removeLayer(state.stopsLine);
                    state.stopsLine = null;
                }
            });
        }

        function fitRouteBounds(strId) {
            let tData = getTruckData(strId);
            let truckCoords = getTruckCoords(tData);
            let routeNode = routesData['route_' + strId] || {};
            let stops = parseStops(routeNode.stops || routeNode);
            let pendingStops = stops.filter(s => s.id > -1000 && s.name !== 'End Location / Depot' && s.status !== 'COMPLETED' && s.status !== 'SKIPPED' && s.confirmation !== 'CANCELLED');
            
            let pts = [];
            if (truckCoords) pts.push(truckCoords);
            pendingStops.forEach(s => {
                if (s.lat && s.lng) pts.push([parseFloat(s.lat), parseFloat(s.lng)]);
            });
            if (pts.length > 1) {
                map.flyToBounds(L.latLngBounds(pts), { padding: [60, 60], maxZoom: 16 });
            } else if (pts.length === 1) {
                map.flyTo(pts[0], 16);
            }
        }

        // AI Re-balance Action
        window.aiRebalance = function() {
            showConfirm(
                "AI Route Re-balance",
                "This will pause all active drivers and completely recalculate their remaining routes based on their current live GPS telemetry. Proceed?",
                () => {
                    const btn = document.getElementById('btn-rebalance');
                    btn.disabled = true;
                    btn.innerHTML = 'Re-balancing...';
                    
                    fetch('/api/ai_rebalance', { method: 'POST' })
                        .then(r => r.json())
                        .then(res => {
                            if (res.success) {
                                showToast("Routes successfully re-balanced & synced to driver fleet!", "success");
                            } else {
                                showToast("Error: " + res.error, "error");
                            }
                        })
                        .catch(e => showToast("Network error during rebalance", "error"))
                        .finally(() => {
                            btn.disabled = false;
                            btn.innerHTML = `<i data-lucide="sparkles" style="width:16px;height:16px;color:var(--accent-primary);"></i><span>AI Re-balance</span>`;
                            if (window.lucide) lucide.createIcons();
                        });
                }
            );
        };

        // Dispatch Messenger Preserved
        let adminTruckMessages = {};
        let adminActiveTruckId = null;
        let adminChatWidgetOpen = false;
        let adminInitialLoadDone = {};
        let adminMessageListeners = {};

        function escapeAdminHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeAdminString(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'");
        }

        function getAllTruckIdsForChat() {
            let ids = new Set();
            if (typeof getAllTrackableTruckIds === 'function') {
                getAllTrackableTruckIds().forEach(id => ids.add(String(id)));
            }
            if (driverMap) Object.keys(driverMap).forEach(id => ids.add(String(id)));
            return Array.from(ids).sort((a,b) => parseInt(a) - parseInt(b));
        }

        function getTruckUnreadCount(tId) {
            let count = 0;
            const msgs = adminTruckMessages[tId];
            if (msgs) {
                for (let k in msgs) {
                    if (msgs[k] && msgs[k].sender === 'driver' && !msgs[k].read) count++;
                }
            }
            return count;
        }

        function ensureAdminTruckMessageListener(tId) {
            if (!tId || isNaN(parseInt(tId))) return;
            tId = String(tId);
            if (adminMessageListeners[tId]) return;
            adminMessageListeners[tId] = true;
            if (!adminTruckMessages[tId]) adminTruckMessages[tId] = {};
            
            const msgRef = db.ref(`trucks/${tId}/messages`);
            msgRef.on('child_added', snapshot => {
                const msg = snapshot.val();
                if (!msg) return;
                adminTruckMessages[tId] = adminTruckMessages[tId] || {};
                adminTruckMessages[tId][snapshot.key] = msg;
                
                if (adminInitialLoadDone[tId] && msg.sender === 'driver' && !msg.read) {
                    let dName = (driverMap && driverMap[tId]) || ('Driver ' + tId);
                    if (!adminChatWidgetOpen || String(adminActiveTruckId) !== String(tId)) {
                        showAdminMessageToast(tId, dName, msg.text || '');
                    }
                }
                
                updateAdminBadges();
                if (adminChatWidgetOpen && String(adminActiveTruckId) === String(tId)) {
                    renderAdminChatMessages();
                    markDriverMessagesRead(tId);
                }
            });

            msgRef.on('value', snapshot => {
                adminTruckMessages[tId] = snapshot.val() || {};
                updateAdminBadges();
                if (adminChatWidgetOpen && String(adminActiveTruckId) === String(tId)) {
                    renderAdminChatMessages();
                }
            });

            msgRef.once('value').then(() => {
                setTimeout(() => { adminInitialLoadDone[tId] = true; }, 1200);
            });
        }

        function updateAdminBadges() {
            let totalUnread = 0;
            const allIds = getAllTruckIdsForChat();
            allIds.forEach(id => {
                totalUnread += getTruckUnreadCount(id);
            });
            const globalBadge = document.getElementById('global-unread-badge');
            if (globalBadge) {
                if (totalUnread > 0) {
                    globalBadge.innerText = totalUnread;
                    globalBadge.style.display = 'flex';
                } else {
                    globalBadge.style.display = 'none';
                }
            }
        }

        function showAdminMessageToast(tId, dName, text) {
            const toast = document.getElementById('admin-message-toast');
            const senderEl = document.getElementById('admin-toast-sender');
            const textEl = document.getElementById('admin-toast-text');
            const btnEl = document.getElementById('admin-toast-btn');
            if (!toast) return;
            
            senderEl.innerText = `Truck ${tId} • ${dName}`;
            textEl.innerText = text;
            btnEl.onclick = () => {
                openAdminChat(tId, dName);
                dismissAdminToast();
            };
            toast.style.display = 'block';
            setTimeout(dismissAdminToast, 8000);
        }

        function dismissAdminToast() {
            const toast = document.getElementById('admin-message-toast');
            if (toast) toast.style.display = 'none';
        }

        function openAdminChat(tId, driverName) {
            if (tId) adminActiveTruckId = String(tId);
            else if (!adminActiveTruckId) {
                const allIds = getAllTruckIdsForChat();
                if (allIds.length > 0) adminActiveTruckId = String(allIds[0]);
            }
            if (!adminActiveTruckId) {
                showToast("No active trucks found to message", "info");
                return;
            }
            ensureAdminTruckMessageListener(adminActiveTruckId);
            const widget = document.getElementById('admin-chat-widget');
            if (widget) {
                widget.style.display = 'flex';
                adminChatWidgetOpen = true;
            }
            dismissAdminToast();
            document.getElementById('admin-chat-header-title').innerText = `Truck ${adminActiveTruckId} • ${driverName || 'Driver'}`;
            renderAdminChatMessages();
            markDriverMessagesRead(adminActiveTruckId);
            if (window.lucide) lucide.createIcons();
        }

        function closeAdminChatWidget() {
            adminChatWidgetOpen = false;
            const widget = document.getElementById('admin-chat-widget');
            if (widget) widget.style.display = 'none';
        }

        function toggleAdminChatWidget() {
            if (adminChatWidgetOpen) closeAdminChatWidget();
            else openAdminChat();
        }

        function renderAdminChatMessages() {
            const container = document.getElementById('admin-chat-messages');
            if (!container) return;
            const msgs = adminTruckMessages[adminActiveTruckId] || {};
            const keys = Object.keys(msgs).sort((a, b) => (msgs[a].timestamp || 0) - (msgs[b].timestamp || 0));
            
            if (keys.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 50px 20px; font-size: 13px;">No messages exchanged yet with Truck ${adminActiveTruckId}.</div>`;
                return;
            }
            
            let html = '';
            keys.forEach(k => {
                const m = msgs[k];
                if (!m) return;
                const isAdmin = m.sender === 'admin';
                const timeStr = m.timestamp ? new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
                html += `
                    <div class="admin-chat-bubble ${isAdmin ? 'admin' : 'driver'}">
                        <div>${escapeAdminHtml(m.text || '')}</div>
                        <div style="font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right;">${timeStr}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function sendAdminChat() {
            const input = document.getElementById('admin-chat-input');
            if (!input) return;
            const text = input.value.trim();
            if (!text || !adminActiveTruckId) return;
            input.value = '';
            
            const newMsg = {
                sender: 'admin',
                senderName: 'Dispatch',
                text: text,
                timestamp: Date.now(),
                read: false
            };
            
            const msgKey = db.ref(`trucks/${adminActiveTruckId}/messages`).push().key;
            const updates = {};
            updates[`trucks/${adminActiveTruckId}/messages/${msgKey}`] = newMsg;
            updates[`trucks/${adminActiveTruckId}/latest_alert`] = {
                msgKey: msgKey,
                sender: 'admin',
                senderName: 'Dispatch',
                text: text,
                timestamp: Date.now(),
                read: false
            };
            db.ref().update(updates);
        }

        function sendAdminCanned(text) {
            const input = document.getElementById('admin-chat-input');
            if (input) input.value = text;
            sendAdminChat();
        }

        function markDriverMessagesRead(tId) {
            if (!tId || !adminTruckMessages[tId]) return;
            const updates = {};
            for (let k in adminTruckMessages[tId]) {
                if (adminTruckMessages[tId][k]?.sender === 'driver' && !adminTruckMessages[tId][k]?.read) {
                    updates[`trucks/${tId}/messages/${k}/read`] = true;
                    adminTruckMessages[tId][k].read = true;
                }
            }
            if (Object.keys(updates).length > 0) db.ref().update(updates);
            updateAdminBadges();
        }
    </script>
</body>
</html>
