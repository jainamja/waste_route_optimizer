<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Waste Route Optimizer</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2F5FFF;
            --surface: #ffffff;
            --background: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--background);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: var(--surface);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            margin: 0 0 8px 0;
            color: var(--text-main);
        }
        .login-card p {
            color: var(--text-muted);
            margin: 0 0 32px 0;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: var(--primary);
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background: #254ee6;
        }
        .error-msg {
            color: #ef4444;
            background: #fee2e2;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            {% if not error %}display: none;{% endif %}
        }
    
        /* Mobile overrides added automatically */
        @media (max-width: 768px) {
            .header, .header-bar { flex-direction: column !important; align-items: flex-start !important; padding: 16px !important; gap: 12px !important; height: auto !important; }
            .header-left, .title-area { width: 100% !important; flex-wrap: wrap !important; }
            .header > div:last-child, .header-bar > div:last-child { width: 100% !important; display: flex !important; flex-wrap: wrap !important; gap: 8px !important; }
            .header > div:last-child .btn, .header-bar > div:last-child .btn, .header-bar > div:last-child a.btn { flex: 1 1 45% !important; justify-content: center !important; text-align: center !important; padding: 10px 8px !important; font-size: 13px !important; }
            .container { padding: 16px !important; gap: 16px !important; }
            .driver-item { flex-direction: column !important; align-items: flex-start !important; gap: 12px !important; }
            .driver-actions { width: 100% !important; display: flex !important; flex-wrap: wrap !important; gap: 8px !important; }
            .driver-actions .btn { flex: 1 !important; justify-content: center !important; }
            .quick-actions { grid-template-columns: 1fr !important; }
            .main-split { flex-direction: column !important; height: auto !important; }
            .trucks-panel { width: 100% !important; height: auto !important; overflow: visible !important; }
            .map-panel { height: 450px !important; flex: none !important; }
            .login-card { padding: 32px 24px !important; max-width: calc(100% - 32px) !important; box-sizing: border-box !important; }
            body, html { overflow-x: hidden !important; }
            .stat-strip { grid-template-columns: 1fr !important; gap: 8px !important; }
            .stat-card { padding: 12px !important; }
        }
</style>
</head>
<body>
    <div class="login-card">
        <i class="fa-solid fa-route" style="font-size: 40px; color: var(--primary); margin-bottom: 16px;"></i>
        <h2>Welcome Back</h2>
        <p>Login to manage your routing operations</p>
        
        <div class="error-msg">{{ error }}</div>
        
        <form method="POST" action="/login">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" required autocomplete="username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>
    </div>
</body>
</html>
