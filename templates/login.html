<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In &mdash; TrashTrekyx</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        .theme-toggle-fixed {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .login-card {
            background: var(--bg-surface);
            padding: 44px 36px;
            border-radius: 20px;
            box-shadow: var(--shadow-hover);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            transition: all 0.25s ease;
        }

        .brand-badge {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px auto;
            border-radius: 14px;
            background: var(--primary-subtle);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .login-card h2 {
            font-family: 'Manrope', sans-serif;
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 8px 0;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .login-card p {
            color: var(--text-muted);
            margin: 0 0 28px 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .error-msg {
            color: var(--danger-text);
            background: var(--danger-subtle);
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(239, 68, 68, 0.25);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            {% if not error %}display: none;{% endif %}
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap i.prefix-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }

        .input-wrap input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrap input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .toggle-pwd {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            font-size: 14px;
        }
        .toggle-pwd:hover {
            color: var(--text-main);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 13px 20px;
            width: 100%;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px var(--primary-glow);
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .app-footer {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .app-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .app-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 22px;
            }
        }
    </style>
    <script>
        if (window.self !== window.top) {
            try {
                window.parent.postMessage({ type: 'ADMIN_LOGOUT' }, '*');
            } catch(e) {}
        }

        function togglePasswordVisibility() {
            var input = document.getElementById('password-input');
            var icon = document.getElementById('pwd-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        }
    </script>
</head>
<body>
    <div class="theme-toggle-fixed">
        <button type="button" class="theme-toggle-btn" onclick="window.toggleTheme()" aria-label="Toggle theme" title="Switch Light/Dark Mode">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <div class="login-card">
        <div class="brand-badge">
            <i class="fa-solid fa-route"></i>
        </div>
        <h2>TrashTrekyx</h2>
        <p>Sign in to manage fleet operations and route optimization</p>

        <div class="error-msg">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>

        <form method="POST" action="/login">
            <div class="input-group">
                <label for="username-input">Username or Driver ID</label>
                <div class="input-wrap">
                    <i class="fa-regular fa-user prefix-icon"></i>
                    <input type="text" id="username-input" name="username" required autocomplete="username" placeholder="Enter username">
                </div>
            </div>
            <div class="input-group">
                <label for="password-input">Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock prefix-icon"></i>
                    <input type="password" id="password-input" name="password" required autocomplete="current-password" placeholder="Enter password">
                    <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()" title="Show/Hide Password" aria-label="Toggle password visibility">
                        <i id="pwd-icon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="app-footer">
            TrashTrekyx Fleet Management &bull; <a href="/privacy-policy">Privacy Policy</a>
        </div>
    </div>
</body>
</html>
